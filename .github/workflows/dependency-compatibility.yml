name: Dependency compatibility

on:
  pull_request:
    paths:
      - "studio/package.json"
      - "studio/package-lock.json"
      - "studio/.nvmrc"
      - "studio/vite.config.ts"
      - "studio/tests/e2e/vite-toolchain.mjs"
      - "studio/desktop/githubWorkflows.test.ts"
      - ".github/workflows/dependency-compatibility.yml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Install, compile, and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install with peer dependency validation
        run: npm ci --prefix studio
      - name: Check workflow and packaging contracts
        working-directory: studio
        run: npm exec -- vitest run desktop/githubWorkflows.test.ts desktop/packaging.test.ts
      - name: Typecheck
        run: npm --prefix studio run typecheck
      - name: Compile browser and desktop
        run: npm --prefix studio run desktop:build
      - name: Exercise development and production in Chromium
        run: npm --prefix studio run test:vite-toolchain
