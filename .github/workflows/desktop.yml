name: Desktop builds

on:
  pull_request:
    paths:
      - "studio/**"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            arch: arm64
            platform: macos
            script: desktop:make:mac:arm64
          - label: macOS Intel
            os: macos-15-intel
            arch: x64
            platform: macos
            script: desktop:make:mac:x64
          - label: Windows x64
            os: windows-2025
            arch: x64
            platform: windows
            script: desktop:make:windows
          - label: Linux x64
            os: ubuntu-24.04
            arch: x64
            platform: linux
            script: desktop:make:linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - name: Install dependencies
        run: npm ci --prefix studio

      - name: Build native installer
        run: npm --prefix studio run ${{ matrix.script }}

      # Main-branch validation only.
