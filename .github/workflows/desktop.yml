name: Desktop builds

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - "scripts/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if (( CHANGED_FILES > 3000 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              studio/*|scripts/*|.github/workflows/desktop.yml) relevant=true; break ;;
            esac
          done <<< "$paths"
          echo "run=$relevant" >> "$GITHUB_OUTPUT"

  make:
    name: ${{ matrix.label }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            arch: arm64
            platform: macos
            script: desktop:make:mac:arm64
          - label: Windows x64
            os: windows-2025
            arch: x64
            platform: windows
            script: desktop:make:windows
          - label: Linux x64
            os: ubuntu-24.04
            arch: x64
            platform: linux
            script: desktop:make:linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.configurations/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm libsqlite3-dev

      - name: Install Windows SQLite development library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'Windows runner has no Vcpkg installation root' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci --prefix studio

      - name: Prepare Electron Windows headers
        if: runner.os == 'Windows'
        run: npm --prefix studio run prepare:electron-windows-headers

      - name: Build native installer
        run: npm --prefix studio run ${{ matrix.script }}
