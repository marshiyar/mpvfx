name: Deterministic quality audit
run-name: Quality audit ${{ inputs.audit_key || github.sha }}

on:
  workflow_dispatch:
    inputs:
      audit_key:
        description: Deterministic scheduler identity
        type: string

permissions:
  contents: read

concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked public dependencies
        run: npm ci --prefix studio
      - name: Run privacy, regression, compile and dependency checks
        run: node scripts/automation/cycle.mjs
      - name: Retain structured status only
        if: ${{ !cancelled() && hashFiles('studio/out/quality/summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-summary
          path: studio/out/quality/summary.json
          if-no-files-found: error
          retention-days: 7
