name: Native source verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Native verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025, ubuntu-24.04]
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run keyframe and diagnostics regressions
        run: npm exec -- vitest run vite.nativeProject.test.ts src/utils/sourcePatcher.test.ts src/utils/studioFileMutationCoordinator.test.ts diagnostics src/diagnostics vite.file-transaction src/hooks/gsap src/hooks/useGsap src/hooks/useAnimatedPropertyCommit.test.tsx src/hooks/useProjectAnimatedPropertyCommit.test.tsx src/hooks/useEnableKeyframes.test.ts src/project src/utils/authoredClipClipboard.test.ts src/utils/splitAuthoredClip.test.ts src/utils/splitAudioAutomation.test.ts src/utils/audioAnimationHandles.test.ts src/hooks/timelineClipboard.test.tsx src/hooks/timelineTrimAnimation.test.ts src/hooks/useTimelineEditing.test.tsx src/hooks/useRazorSplit.native.test.tsx src/hooks/useRazorSplit.audioAutomation.test.tsx desktop/audioAnimationHandles.test.ts src/components/TimelineToolbar.test.tsx src/contexts/DomEditContext.test.tsx src/hooks/useDomEditSession.test.tsx
      - name: Typecheck the current source
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Build the native app
        if: ${{ !cancelled() }}
        id: build
        run: npm run desktop:build
      - name: Verify native keyframe gestures, persistence and undo
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Linux' }}
        run: npm run test:native-keyframes-e2e -- --electron
      - name: Verify native keyframes in the Linux desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:native-keyframes-e2e -- --electron
      - name: Verify native idle memory, export, crash and recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Linux' }}
        run: npm run test:diagnostics-native
      - name: Verify native diagnostics in the Linux desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:diagnostics-native
      - name: Validate synthetic screenshot evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: evidence
        working-directory: .
        run: node scripts/automation/native-evidence.mjs
      - name: Retain generated-media app evidence
        if: ${{ !cancelled() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-keyframes-${{ matrix.os }}
          path: studio/out/native-keyframe-verification/public-evidence
          retention-days: 3
          if-no-files-found: error
