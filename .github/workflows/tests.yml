name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - "third_party/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/tests.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash
        run: |
          set -euo pipefail
          if (( CHANGED_FILES > 3000 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              studio/*|third_party/*|scripts/*|docs/*|LICENSE|NOTICE|.github/workflows/tests.yml|.github/workflows/release.yml) relevant=true; break ;;
              *.md) if [[ "$path" != */* ]]; then relevant=true; break; fi ;;
            esac
          done <<< "$paths"
          echo "run=$relevant" >> "$GITHUB_OUTPUT"

  compile:
    name: Typecheck and compile
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.configurations/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev

      - name: Install dependencies
        run: npm ci --prefix studio

      - name: Check release inputs and notices
        run: npm --prefix studio run release:check

      # The build script performs typecheck before compiling; do not run it twice.
      - name: Typecheck and compile source
        run: npm --prefix studio run build

      - name: Install pinned test browser
        working-directory: studio
        run: node_modules/.bin/puppeteer browsers install chrome

      - name: Exercise editor and runtime behavior
        env:
          HYPERFRAMES_FFMPEG_PATH: ${{ github.workspace }}/studio/node_modules/ffmpeg-static/ffmpeg
        run: npm --prefix studio test
