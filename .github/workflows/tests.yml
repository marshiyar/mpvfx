name: Tests

on:
  pull_request:
    paths:
      - "studio/**"
      - "third_party/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/tests.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - "third_party/**"
      - "scripts/**"
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/tests.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Typecheck and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: studio/.configurations/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix studio

      - name: Typecheck source
        run: npm --prefix studio run typecheck

      - name: Compile source
        run: npm --prefix studio run build
