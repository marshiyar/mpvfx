name: Daily quality scheduler

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/quality-schedule.yml", "scripts/automation/dispatch.mjs", "scripts/automation/dispatch.test.mjs"]

permissions:
  contents: read

concurrency:
  group: daily-quality-scheduler
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - run: node --test scripts/automation/dispatch.test.mjs
  dispatch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/automation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Queue only checks that need a new result
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/dispatch.mjs
