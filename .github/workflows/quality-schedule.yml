name: Quality check planner

on:
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/quality-schedule.yml", "scripts/automation/dispatch.mjs", "scripts/automation/dispatch.test.mjs"]

permissions:
  contents: read

concurrency:
  group: quality-check-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - run: node --test scripts/automation/dispatch.test.mjs
  plan:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/automation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Suggest checks without starting any runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/dispatch.mjs
